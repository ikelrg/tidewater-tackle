<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tidewater Tackle</title>
<meta name="theme-color" content="#161a35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
<style>
/* Layout: one-screen phone game. Header (coins) > pixel scene > Cast button > scrolling panel > tab bar.
   Single dusk look on purpose: a lake that meets the sea at sunset. */
:root{
  color-scheme: dark;
  --bg:#161a35;
  --panel:#222750;
  --panel2:#2c3262;
  --line:#0c0e22;
  --ink:#f3ead8;
  --muted:#c6cbf0;
  --amber:#ffb454;
  --amber-d:#b86f17;
  --teal:#4fd0c0;
  --red:#ff6b6b;
  --f-ui:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --f-text:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-num:"VT323","Courier New",monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-text);font-weight:500;font-size:16px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
h1,#castBtn{font-family:var(--f-ui)}
h2,h3,.mbtn,nav#tabs button,.up .t,.close,#card .nm{font-family:var(--f-text);font-weight:800}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px 22px}

header{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);padding:6px 10px}
.coins{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1;overflow:hidden}
#coins{font-family:var(--f-num);font-size:40px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.coins small,.rate small{color:var(--muted);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.rate{text-align:right;font-family:var(--f-num);font-size:30px;color:var(--teal);line-height:1;white-space:nowrap}
@media (max-width:420px){#coins{font-size:35px}.rate{font-size:26px}}
@media (max-width:460px){.coins small{display:none}.icon-btn{width:34px!important;height:34px!important}header{gap:8px}}
.icon-btn{width:38px;height:38px;border:2px solid var(--line);background:var(--panel2);display:grid;place-items:center;padding:0}
.icon-btn svg{width:20px;height:20px;fill:var(--ink)}
.icon-btn[aria-pressed="false"] svg{opacity:.35}

#stage{position:relative;width:100%;aspect-ratio:4/3;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);background:#2f2860;overflow:hidden;flex:0 0 auto}
#scene{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hint{position:absolute;left:8px;right:8px;bottom:8px;text-align:center;background:rgba(12,14,34,.78);padding:6px 8px;font-size:16px;font-weight:700;color:var(--ink)}
#card{z-index:3;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86%,300px);background:var(--panel);border:3px solid var(--rc,#fff);box-shadow:0 6px 0 var(--line);padding:10px 12px 12px;text-align:center}
#card .tier{font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--rc)}
#card .pic{height:100px;display:grid;place-items:center;margin:4px 0}
#card .pic img{image-rendering:pixelated;max-width:100%;max-height:100%}
#card .nm{font-size:20px;font-weight:800}
#card .mut{font-size:16px;margin-top:2px;font-weight:800}
#card .res{margin-top:6px;font-family:var(--f-num);font-size:30px;line-height:1.05}
#card.big{box-shadow:0 0 0 3px var(--rc),0 0 30px var(--rc);animation:pop .35s ease-out}
.pop{position:absolute;z-index:4;left:50%;top:22%;transform:translateX(-50%);font-family:var(--f-num);font-size:34px;letter-spacing:.04em;text-shadow:0 3px 0 #140f24,0 0 12px #000;pointer-events:none;animation:popfx .9s ease-out forwards}
@keyframes popfx{0%{opacity:0;transform:translateX(-50%) scale(.6)}20%{opacity:1;transform:translateX(-50%) scale(1.15)}100%{opacity:0;transform:translateX(-50%) translateY(-18px) scale(1)}}
.flash{position:absolute;z-index:2;inset:0;pointer-events:none;opacity:0;animation:flashfx .8s ease-out}
@keyframes flashfx{0%{opacity:.6}100%{opacity:0}}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.8)}60%{transform:translate(-50%,-50%) scale(1.06)}100%{transform:translate(-50%,-50%) scale(1)}}
#card .badge{display:inline-block;background:var(--amber);color:#2a1a05;font-size:14px;font-weight:800;padding:1px 6px;margin-right:6px;vertical-align:middle}

#castBtn{border:3px solid var(--line);background:var(--amber);color:#2a1a05;font-size:22px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:12px;box-shadow:0 5px 0 var(--amber-d),0 8px 0 var(--line);transition:transform .05s}
#castBtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--amber-d),0 5px 0 var(--line)}
#castBtn:disabled{background:#8a7a5c;box-shadow:0 5px 0 #5c5038,0 8px 0 var(--line);cursor:default}
#castBtn.bite{background:var(--red);animation:shake .12s infinite}
@keyframes shake{50%{transform:translateX(3px)}}

#panel{flex:1 1 0;min-height:120px;overflow-y:auto;overflow-x:hidden;background:var(--panel);border:2px solid var(--line);padding:10px;-webkit-overflow-scrolling:touch}
h2{margin:0 0 8px;font-size:20px;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:15px}

.up{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:8px 10px;margin-bottom:8px}
.up .t{font-weight:800;font-size:18px}
.up .lv{color:var(--muted);font-size:14px;font-weight:700;margin-left:6px}
.up .d{grid-column:1;color:#dfe2f8;font-size:15px;min-width:0}
.up button{grid-column:2;grid-row:1/3;border:2px solid var(--line);background:var(--teal);color:#06221e;font-weight:600;padding:8px 10px;min-width:96px;font-family:var(--f-num);font-size:26px;line-height:1;box-shadow:0 3px 0 #1f7a70}
.up button:disabled{background:#4a5080;color:#9aa0cf;box-shadow:0 3px 0 #323864;cursor:default}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fcard{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel2);border:2px solid var(--rc,#444);padding:6px 4px 6px;min-width:0;text-align:center}
.fcard.unk{border-color:#3b4175}
.fcard .spr{height:52px;display:grid;place-items:center}
.fcard .spr img{image-rendering:pixelated}
.fcard .nm{font-family:var(--f-text);font-size:15px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .inc{font-family:var(--f-num);font-size:22px;color:var(--teal);line-height:1}
.pips{display:flex;gap:2px;margin-top:3px;align-items:center}
.pip{width:7px;height:7px;background:#1a1e42;border:1px solid #3b4175}
.pip.on{border-color:var(--line)}
.pgap{width:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin:0 0 6px;font-size:14px;font-weight:700;color:var(--muted)}
.legend .sw{display:inline-block;width:8px;height:8px;margin-right:4px;vertical-align:baseline}
.legend em{font-style:normal;opacity:.7}
h3.th{margin:14px 0 6px;font-size:19px;font-weight:800}
#env{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;pointer-events:none}
#env .chip{background:rgba(12,14,34,.78);padding:4px 8px;font-size:14px;font-weight:800;line-height:1.2;display:flex;align-items:center;gap:6px;color:var(--ink)}
#env .chip small{color:#dfe2f8;font-size:13px;font-weight:700}
#env .tbar{display:inline-block;width:26px;height:6px;background:#1a1e42;border:1px solid #3b4175}
#env .tbar i{display:block;height:100%;background:var(--teal)}
#env .wdot{width:8px;height:8px;background:var(--cc,#fff);display:inline-block}
#ver{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(3px + env(safe-area-inset-bottom,0px));z-index:60;font-family:var(--f-num);font-size:13px;line-height:1;color:var(--muted);opacity:.85;pointer-events:none}
.var span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logrow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #343a70}
.logrow img{image-rendering:pixelated;width:44px;height:auto;flex:0 0 auto}
.logrow .tx{min-width:0;flex:1;font-size:16px;font-weight:700}
.logrow .r{font-family:var(--f-num);font-size:23px;color:var(--teal);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--panel2);border:2px solid var(--line);padding:6px 8px}
.stat b{display:block;font-family:var(--f-num);font-size:30px;font-weight:400;line-height:1;color:var(--amber)}
.stat span{font-size:14px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.tchip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;padding:1px 6px 1px 3px;border:2px solid var(--tc);color:var(--tc);background:rgba(0,0,0,.25);white-space:nowrap}
.tchip b{font-family:var(--f-num);font-weight:400;font-size:16px;color:var(--ink)}
.ti{width:18px;height:18px;image-rendering:pixelated;display:block;flex:0 0 auto}
.ticons{display:flex;gap:2px;justify-content:center;min-height:16px;margin-top:1px}
.ticons .ti{width:16px;height:16px}
.trow .ti{width:26px;height:26px;flex:0 0 26px}
.trow.off .ti{filter:grayscale(1);opacity:.4}
.trow .td.live{color:var(--teal)}
.cmprow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2px;margin:4px 0 2px}
.cmprow .arr{color:var(--amber);display:grid;place-items:center;padding-top:20px}
.cmp{display:flex;flex-direction:column;align-items:center;min-width:0}
.cmp .lab{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--muted)}
.cmp.new .lab{color:var(--teal)}
.cmp.old{opacity:.8}
.cmp .cpic{height:60px;display:grid;place-items:center}
.cmp .cpic img{image-rendering:pixelated}
.cmp .vn{font-size:14px;font-weight:800;white-space:nowrap}
.cmp .vn b{font-family:var(--f-num);font-weight:400;font-size:16px;color:var(--ink)}
.cmp .pay{font-family:var(--f-num);font-size:23px;line-height:1.05;color:var(--teal)}
.cmp.old .pay{color:var(--muted)}
.chip{font-size:13px;font-weight:800;padding:1px 6px;border:2px solid currentColor;background:rgba(0,0,0,.25);white-space:nowrap}
.trow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #343a70}
.trow .tn{font-weight:800;font-size:16px;flex:0 0 112px}.trow .td{flex:1;font-size:14px;color:var(--muted);font-weight:700}
.trow .tb{font-family:var(--f-num);font-size:23px;color:var(--teal)}.trow.off .tn{opacity:.55}
.link-btn{border:2px solid var(--line);background:var(--panel2);padding:8px 12px;font-size:15px;font-weight:700;color:var(--muted)}
.link-btn.warn{background:var(--red);color:#2a0808}

nav#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav#tabs button{border:2px solid var(--line);background:var(--panel);padding:10px 2px;font-size:16px;font-weight:800;color:var(--muted);box-shadow:0 3px 0 var(--line)}
nav#tabs button[aria-selected="true"]{background:var(--panel2);color:var(--ink);border-color:var(--teal)}

#modal{position:fixed;inset:0;background:rgba(8,9,24,.72);display:grid;place-items:center;z-index:50;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#modalBox{width:min(100%,380px);max-height:88%;overflow:auto;background:var(--panel);border:3px solid var(--rc,var(--teal));box-shadow:0 6px 0 var(--line);padding:14px}
#modalBox h3{margin:0 0 6px;font-size:22px}
#modalBox .big{display:grid;place-items:center;height:96px;margin:6px 0}
#modalBox .big img{image-rendering:pixelated}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:16px;margin:8px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:800}
.vars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:8px 0}
.var{background:var(--panel2);border:2px solid var(--line);padding:3px 1px;text-align:center;font-size:12px;font-weight:700;min-width:0}
.var .vi{height:30px;display:grid;place-items:center}
.var img{image-rendering:pixelated;max-width:100%;max-height:100%}
.var.off{opacity:.9}
#modalBox .close{width:100%;margin-top:6px;border:2px solid var(--line);background:var(--amber);color:#2a1a05;font-weight:800;padding:9px;font-size:16px}
#menu{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;justify-content:center;overflow-y:auto;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
#menuIn{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px;padding-block:14px;justify-content:center}
#menuScene{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
#menu h1{margin:4px 0 0;font-size:38px;line-height:1;font-weight:600;color:var(--amber);text-align:center;letter-spacing:.02em;text-shadow:0 3px 0 var(--line)}
#menu .tag{margin:0;text-align:center;color:#dfe2f8;font-size:17px}
.mbtns{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.mbtn{border:3px solid var(--line);background:var(--panel2);font-size:19px;font-weight:800;padding:11px;box-shadow:0 4px 0 var(--line)}
.mbtn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.mbtn.main{background:var(--amber);color:#2a1a05;font-size:24px;letter-spacing:.06em;text-transform:uppercase;padding:13px;box-shadow:0 5px 0 var(--amber-d),0 8px 0 var(--line)}
.mbtn.warn{background:var(--red);color:#2a0808}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mstat{text-align:center;font-size:16px;font-weight:700;color:#dfe2f8}
.mstat b{color:var(--teal);font-weight:600}
.howto{margin:8px 0 10px;padding-left:20px;font-size:17px;line-height:1.45}
.howto li{margin-bottom:6px}
@media (prefers-reduced-motion:reduce){#castBtn.bite{animation:none}}
</style>

</head>
<body>
<div id="app">
  <header>
    <div class="coins"><span id="coins">0</span><small>coins</small></div>
    <div class="rate"><span id="rate">0</span><small> /sec</small></div>
    <button class="icon-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16v3H4zm0 5h16v3H4zm0 5h16v3H4z"/></svg></button>
    <button class="icon-btn" id="snd" aria-label="Sound" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
  </header>

  <div id="stage">
    <canvas id="scene" width="160" height="120"></canvas>
    <div id="env"></div>
    <div id="hint">Tap CAST. Every new fish pays coins every second.</div>
    <div id="card" hidden></div>
  </div>

  <button id="castBtn">Cast</button>

  <section id="panel" aria-live="polite"></section>

  <nav id="tabs" role="tablist">
    <button role="tab" data-tab="up" aria-selected="true">Gear</button>
    <button role="tab" data-tab="album" aria-selected="false">Album</button>
    <button role="tab" data-tab="traits" aria-selected="false">Traits</button>
    <button role="tab" data-tab="log" aria-selected="false">Log</button>
  </nav>
</div>
<div id="ver"></div>
<div id="menu">
  <div id="menuIn">
    <canvas id="menuScene" width="160" height="120"></canvas>
    <div>
      <h1>Tidewater Tackle</h1>
      <p class="tag">Where the lake meets the sea. Cast, collect, relax.</p>
    </div>
    <div class="mstat" id="mstat"></div>
    <div class="mbtns">
      <button class="mbtn main" id="mPlay">Play</button>
      <div class="mrow">
        <button class="mbtn" id="mHow">How to play</button>
        <button class="mbtn" id="mSound">Sound: On</button>
      </div>
      <button class="mbtn" id="mCode">Save code (backup / move)</button>
      <button class="mbtn" id="mNew" hidden>New game</button>
    </div>
  </div>
</div>
<div id="modal" hidden><div id="modalBox"></div></div>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);

/* ---------- data ---------- */
const TIERS=[
  {n:"Common",w:60,c:"#b9c2d0"},{n:"Uncommon",w:25,c:"#7bd88f"},{n:"Rare",w:3,c:"#5aa9ff"},
  {n:"Epic",w:.35,c:"#b77cff"},{n:"Legendary",w:.08,c:"#ffb454",g:5},{n:"Mythic",w:.006,c:"#ff5d8f",g:12}];
// g = Lucky Rod level needed before that tier can bite at all
const MUTS=[
  {id:"shiny",n:"Shiny",m:2,p:1/40,ab:"Sh",c:"#8fe9ff"},
  {id:"giant",n:"Giant",m:3,p:1/120,ab:"Gi",c:"#8ff0a4"},
  {id:"golden",n:"Golden",m:6,p:1/400,ab:"Go",c:"#ffd45a"},
  {id:"glitch",n:"Glitched",m:15,p:1/2000,ab:"Gl",c:"#ff5dd8"}];
const WMUTS=[
  {id:"rain",n:"Rain-kissed",m:4,p:1/22,wx:"rain",ab:"Ra",c:"#6ab8ff"},
  {id:"fog",n:"Ghostly",m:5,p:1/26,wx:"fog",ab:"Fo",c:"#e0e8f5"},
  {id:"snow",n:"Frosted",m:6,p:1/30,wx:"snow",ab:"Sn",c:"#bfe8ff"},
  {id:"storm",n:"Charged",m:8,p:1/40,wx:"storm",ab:"St",c:"#ffe45a"},
  {id:"aurora",n:"Auroral",m:12,p:1/70,wx:"aurora",ab:"Au",c:"#5dffb0"}];
const ALL_MUTS=MUTS.concat(WMUTS);
const MUT_BY={};ALL_MUTS.forEach(m=>MUT_BY[m.id]=m);
const WX_NAME={rain:"Rain",fog:"Fog",snow:"Snow",storm:"Storm",aurora:"Aurora"};
const VERSION="3.2";
const ROLL_ORDER=["glitch","golden","giant","shiny"];

const F=(id,n,w,t,inc,sp)=>({id,n,w,t,inc,sp});
const FISH=[
 // ---- Common ----
 F("minnow","Minnow","Lake",0,1,{rx:5,ry:2,t:3,tw:.5,dh:1,b:"#8fb3a0",l:"#d9e8dc",f:"#6f9484",a:"#4f7a6b",pat:"lateral"}),
 F("roach","Roach","Lake",0,1,{rx:6,ry:3,t:3,tw:.6,dh:2,b:"#a9b8c4",l:"#eef2f5",f:"#d8553a",a:"#6c7f8c",pat:"lateral"}),
 F("bleak","Bleak","Lake",0,1,{rx:6,ry:2,t:3,tw:.6,dh:1,b:"#b7c9bd",l:"#f2f6f1",f:"#9bb0a2",a:"#7b9387",pat:"none"}),
 F("stickle","Stickleback","Lake",0,2,{rx:4,ry:3,t:2,tw:.5,dh:3,b:"#7a8f5a",l:"#d9dfa8",f:"#5a6e3e",a:"#c0392b",pat:"spots",dens:10}),
 F("perch","Perch","Lake",0,2,{rx:7,ry:4,t:3,tw:.6,dh:3,b:"#8aa63a",l:"#e6e8a0",f:"#d9622b",a:"#4a5a1c",pat:"stripes"}),

const upCost=(u,l)=>Math.ceil(u.base*Math.pow(u.g,l));
function waitBase(l){return Math.max(0.9,2.2*Math.pow(0.94,l));}
function avgWait(l){return 0.8+0.8*waitBase(l);}
function rollWait(){const m=0.8*waitBase(S.up.line);return 0.8+Math.min(3*m,-Math.log(1-Math.random())*m);}

/* ---------- state ---------- */
const KEY="tidewater_v3";
const OLD_KEYS=["tidewater_v1","tidewater_v22"];
let wasReset=false;
function fresh(){return{coins:0,fish:{},up:{rod:0,line:0,bait:0,lamp:0},casts:0,tseen:{},log:[],rb:0,pity:0,tab:"up",sound:true,last:Date.now(),started:Date.now()};}
let S=fresh();
function load(){try{for(const k of OLD_KEYS){if(localStorage.getItem(k)!==null){wasReset=true;localStorage.removeItem(k);}}}catch(e){}
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=Object.assign(fresh(),o);if(!S.tseen)S.tseen={};S.up=Object.assign(fresh().up,o.up||{});migrate();}}catch(e){}}
function save(){try{S.last=Date.now();localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function R(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),w,h);}
const SKY=["#241f4d","#2f2860","#43336f","#5d3d79","#80497f","#a85a80","#d07a7e","#eda07c","#f8c58a"];
const DEPTH=["#2a4f7a","#244a74","#1f4068","#1a3860","#16305a","#122850"];

function drawWeather(t){
  const w=weatherInfo(Date.now()).kind;if(!w)return;
  if(w==="rain"||w==="storm"){
    cx.fillStyle=w==="storm"?"rgba(8,10,34,.42)":"rgba(10,15,40,.26)";cx.fillRect(0,0,160,120);
    const n=w==="storm"?110:60,sp=w==="storm"?130:95;
    cx.fillStyle="rgba(190,220,255,.65)";
    for(let i=0;i<n;i++){const x=((i*37+t*sp*.25)%172)-6,y=((i*53+t*sp)%132)-6;cx.fillRect(Math.round(x),Math.round(y),1,3);}
    if(w==="storm"&&((t*2)%11)<.22){
      cx.fillStyle="rgba(255,255,255,.4)";cx.fillRect(0,0,160,120);
      cx.strokeStyle="#fff7b0";cx.lineWidth=1;cx.beginPath();cx.moveTo(92,0);cx.lineTo(88,14);cx.lineTo(94,22);cx.lineTo(86,40);cx.lineTo(90,50);cx.stroke();
    }

    for(let i=0;i<5;i++){const y=50+i*11,off=(t*(2+i)+i*40)%160;cx.fillStyle="rgba(225,232,245,.16)";cx.fillRect(Math.round(off-160),y,160,9);cx.fillRect(Math.round(off),y,160,9);}
  }else if(w==="snow"){
    cx.fillStyle="rgba(200,225,255,.07)";cx.fillRect(0,0,160,120);cx.fillStyle="#fff";
    for(let i=0;i<55;i++){const x=(((i*29+Math.sin(t*.8+i)*5)%162)+162)%162-1,y=((i*47+t*(10+(i%5)*3))%126)-3,z=i%7?1:2;cx.fillRect(Math.round(x),Math.round(y),z,z);}
  }else if(w==="aurora"){
    const cols=["rgba(93,255,176,","rgba(138,124,255,","rgba(70,232,208,"];
    for(let k=0;k<3;k++)for(let x=0;x<160;x++){
      const y=12+k*9+Math.sin(x*.045+t*.55+k*2)*7+Math.sin(x*.11+t*.3)*2,a=.22+.1*Math.sin(x*.07+t+k);
      cx.fillStyle=cols[k]+a.toFixed(2)+")";cx.fillRect(x,Math.round(y),1,7);
    }
  }
}
function drawScene(t,now){
  for(let i=0;i<SKY.length;i++)R(0,i*7,160,7,SKY[i]);
  STARS.forEach(([x,y],i)=>{if(Math.sin(t*2+i*1.7)>-.3)R(x,y,1,1,"#fff6dc");});
  // sun
  for(let dy=-10;dy<=0;dy++){const w=Math.round(Math.sqrt(100-dy*dy));R(112-w,60+dy,w*2,1,dy>-4?"#ffe3a0":"#ffd286");}
  // far hills
  for(let x=0;x<160;x++){
    let h=6+5*Math.sin(x*.07)+4*Math.sin(x*.19+1);if(x<64)h+=12*(1-x/64);
    R(x,60-h,1,h,"#352a5e");
  }
  // pines
  [[5,22],[15,17],[25,24],[36,15],[46,19]].forEach(([x,h])=>{
    for(let k=0;k<h;k++){const w=Math.round(1+k*.32);R(x-w,60-h+k,w*2+1,1,k%5<2?"#17294a":"#1b3254");}
    R(x,60,1,2,"#17294a");
  });
  // lighthouse
  const blink=Math.sin(t*1.6)>0;
  R(145,42,5,18,"#e8e0d0");R(145,47,5,3,"#c0392b");R(145,53,5,3,"#c0392b");
  R(144,38,7,4,blink?"#ffe08a":"#9a7a3a");R(145,35,5,3,"#8a2f3f");
  if(blink){cx.fillStyle="rgba(255,226,138,.22)";cx.fillRect(100,39,44,2);}
  // water
  for(let i=0;i<6;i++)R(0,60+i*10,160,10,DEPTH[i]);
  cx.fillStyle="rgba(248,197,138,.55)";
  for(let y=61;y<92;y+=2){const w=Math.max(2,14-(y-60)*.35+Math.sin(t*2.2+y)*3);cx.fillRect(Math.round(112-w/2),y,Math.round(w),1);}
  cx.fillStyle="rgba(255,255,255,.13)";
  for(let r=0;r<15;r++){const y=62+r*4;for(let k=0;k<5;k++){const x=((k*37+r*13+t*(5+r*.9))%172)-6;cx.fillRect(Math.round(x),y,4+(r>>1),1);}}
  // background swimmers
  for(let k=0;k<3;k++){
    const y=72+k*14,dir=k%2?-1:1,x=((t*(7+k*3)*dir+k*60)%190+190)%190-15;
    cx.fillStyle="rgba(10,18,50,.45)";cx.fillRect(Math.round(x),y,8,3);cx.fillRect(Math.round(x)-(dir>0?3:-8),y-1,3,5);
  }
  // dock
  R(0,94,52,5,"#6b4a2e");for(let x=6;x<52;x+=8)R(x,94,1,5,"#4a321f");R(0,94,52,1,"#8a6440");
  R(8,99,3,16,"#4a321f");R(38,99,3,16,"#4a321f");
  // fireflies
  for(let k=0;k<6;k++){if(Math.sin(t*1.3+k*2.1)>0){R(8+k*9+Math.sin(t+k)*4,48+Math.cos(t*.8+k*3)*7,1,1,"#ffe98a");}}
  // tide: water rises and falls around the dock posts
  const lvl=tideInfo(Date.now()).lv,wl=Math.round(103-lvl*5);
  cx.fillStyle="rgba(20,44,86,.8)";cx.fillRect(0,wl,160,120-wl);
  cx.fillStyle="rgba(255,255,255,.28)";for(let k=0;k<8;k++){const x=((k*23+t*6)%166)-6;cx.fillRect(Math.round(x),wl,5,1);}
  // fisher
  R(17,86,2,8,"#252a52");R(20,86,2,8,"#252a52");
  R(16,76,7,10,"#c9573a");R(16,76,7,2,"#e07a5a");
  R(17,70,5,5,"#f0c8a0");R(16,67,7,3,"#e0b050");R(15,70,9,1,"#e0b050");
  // rod
  cx.strokeStyle="#7a5530";cx.lineWidth=1;cx.beginPath();cx.moveTo(23,80);cx.lineTo(ROD.x,ROD.y);cx.stroke();
  // bobber position
  const el=(now-pt0)/1000;
  if(phase==="cast"){const p=Math.min(1,el/.7);bob.x=ROD.x+(TARGET.x-ROD.x)*p;bob.y=ROD.y+(TARGET.y-ROD.y)*p-Math.sin(p*Math.PI)*34;}
  else if(phase==="wait"){bob.x=TARGET.x;bob.y=TARGET.y+Math.sin(t*3)*.8;}
  else if(phase==="bite"){bob.x=TARGET.x;bob.y=TARGET.y+(Math.sin(t*45)>0?2:4);}
  else if(phase==="reel"){const p=Math.min(1,el/.5);bob.x=TARGET.x+(IDLE.x-TARGET.x)*p;bob.y=TARGET.y+(IDLE.y-TARGET.y)*p-Math.sin(p*Math.PI)*8;}
  else{bob.x=IDLE.x;bob.y=IDLE.y+Math.sin(t*2.4)*.8;}
  // line
  cx.strokeStyle="rgba(240,240,240,.85)";cx.beginPath();cx.moveTo(ROD.x,ROD.y);
  const sag=(phase==="wait"||phase==="bite")?6:3;
  cx.quadraticCurveTo((ROD.x+bob.x)/2,(ROD.y+bob.y)/2+sag,bob.x,bob.y-1);cx.stroke();
  // ripples
  ripples=ripples.filter(r=>now-r.t0<1200);
  ripples.forEach(r=>{const p=(now-r.t0)/1200;cx.strokeStyle=`rgba(255,255,255,${.5*(1-p)})`;cx.beginPath();cx.ellipse(r.x,r.y+2,3+p*14,1+p*4,0,0,Math.PI*2);cx.stroke();});
  drawWeather(t);

  if(phase==="bite"){R(bob.x,bob.y-16,2,7,"#fff");R(bob.x,bob.y-7,2,2,"#fff");}
}

const btn=$("#castBtn");
function setBtn(){
  btn.classList.toggle("bite",phase==="bite");
  btn.disabled=!(phase==="idle"||phase==="wait"||phase==="bite");
  btn.textContent=phase==="idle"?"Cast":phase==="cast"?"Casting...":phase==="wait"?"Tap to lure":phase==="bite"?"HOOK!":"Reeling...";
}
function go(p,now){phase=p;pt0=now;setBtn();}
function startCast(){
  if(phase==="wait"){pt0-=250;lureTaps++;return;}
  if(phase==="bite"){hook();return;}
  if(phase!=="idle")return;
  hideCard();$("#hint").hidden=true;
  waitDur=rollWait();lureTaps=0;hookF=1;
  sfx.cast();go("cast",performance.now());
}
function pop(txt,col){const d=document.createElement("div");d.className="pop";d.textContent=txt;d.style.color=col;$("#stage").appendChild(d);setTimeout(()=>d.remove(),900);}
function hook(){
  const el=(performance.now()-pt0)/1000;
  if(el<HOOK_PERFECT){hookF=1.5;pop("PERFECT!","#5dffb0");sfx.catch(3);buzz(60);}
  else{hookF=1;pop("Good","#ffd45a");}
  go("reel",performance.now());
}
function stepPhase(now){
  const el=(now-pt0)/1000;
  if(phase==="cast"&&el>=.7){ripples.push({x:TARGET.x,y:TARGET.y,t0:now});go("wait",now);}
  else if(phase==="wait"&&el>=waitDur){ripples.push({x:TARGET.x,y:TARGET.y,t0:now});sfx.bite();buzz(40);go("bite",now);}
  else if(phase==="bite"&&el>=HOOK_WINDOW){hookF=.6;pop("Missed","#9aa0c8");go("reel",now);}
  else if(phase==="reel"&&el>=.5){go("idle",now);doCatch();}
}
function doCatch(){
  const f=rollFish(),mut=rollMut(),fi=FISH.indexOf(f),tr=rollTraits();
  const mult=Math.round((mut?mut.m:1)*traitMult(tr)*100)/100;
  if(S.up.rod>=TIERS[4].g){S.pity=f.t>=4?0:(S.pity||0)+1;}
  const e=S.fish[f.id]||(S.fish[f.id]={best:0,count:0,norm:0,muts:{}});
  e.count++;S.casts++;if(mut)e.muts[mut.id]=1;else e.norm=1;
  tr.forEach(i=>{S.tseen[i]=1;});
  let kind,gain,old=null;
  if(!e.best){e.best=mult;e.bm=mut?mut.id:null;e.tr=tr;kind="new";gain=f.inc*mult*lampMult()*rbMult();}
  else if(mult>e.best){old={mut:bestMutId(e),tr:e.tr||[],best:e.best};gain=f.inc*(mult-e.best)*lampMult()*rbMult();e.best=mult;e.bm=mut?mut.id:null;e.tr=tr;kind="better";}
  else{gain=Math.round(f.inc*mult*SELL_X);S.coins+=gain;kind="sold";}
  S.log.unshift({fi,mut:mut?mut.id:null,tr,kind,gain});if(S.log.length>40)S.log.length=40;
  sfx.catch(f.t+(mut?1:0)+(tr.length>1?1:0));buzz(f.t>=3?120:30);
  showCard(fi,mut,kind,gain,tr,mult,old);
  if(f.t>=3||(mut&&mut.m>=6)||tr.length>=2||traitMult(tr)>=4)flash(TIERS[f.t].c);
  save();refreshAll();
}

      h+=`<button class="fcard" data-fi="${i}" style="--rc:${T.c}"><div class="spr">${spriteImg(i,bestMutId(e),false,66,f.n,44)}</div><div class="nm">${f.n}</div>
        <div class="inc">${fmt(f.inc*e.best*lampMult()*rbMult())}/s</div><div class="ticons">${(e.tr||[]).map(iconImg).join("")}</div><div class="pips">${pipHTML(e,MUTS)}<span class="pgap"></span>${pipHTML(e,WMUTS)}</div></button>`;
    });
    h+=`</div>`;
  });
  panel.innerHTML=h;
}
function bestMutId(e){if(e.bm!==undefined)return e.bm;const m=MUTS.find(x=>x.m===e.best);return m?m.id:null;}
function renderTraits(){
  const seen=TRAITS.filter(t=>S.tseen[t.id]).length,now=new Date(),wk=dayInfo(now);
  let h=`<h2>Traits ${seen}/${TRAITS.length}</h2><p class="small muted" style="margin:0 0 8px">Traits are rare. You earn them by how, when and where you fish. A catch can carry up to 3, and they multiply with each other and with the mutation.</p>`;
  Object.keys(TGROUP).forEach(gk=>{
    const G=TGROUP[gk];
    h+=`<h3 class="th" style="color:${G.c}">${G.n} <span class="muted small">${G.sub}</span></h3>`;
    if(gk==="day")h+=`<div class="small" style="margin:-2px 0 4px;color:${G.c}">Today: <b>${TR_BY[wk.id].n}</b> · changes in ${fmtLeft(wk.left)}</div>`;
    TRAITS.filter(t=>t.g===gk).forEach(t=>{
      const got=!!S.tseen[t.id];let d=t.d,live="";
      if(gk==="day"){const on=wk.id===t.id;d=on?"Active now":"Back on another day";live=on?"on":"";}
      if(gk==="season"){const se=SEASONS.find(x=>x.id===t.id),si=seasonInfo(se,now);
        d=`${MONTHS[se.f[0]-1]} ${se.f[1]} to ${MONTHS[se.t[0]-1]} ${se.t[1]}`+(si.on?` · ${fmtLeft(si.left)} left`:` · in ${fmtLeft(si.in)}`);live=si.on?"on":"";}
      h+=`<div class="trow ${got?"":"off"}"><img class="ti" src="${iconURL(t.ic)}" alt=""><span class="tn" style="color:${t.col}">${t.n}${got?" ✓":""}</span><span class="td${live?" live":""}">${d}</span><span class="tb">x${t.m}</span></div>`;
    });
  });
  panel.innerHTML=h;
}
function renderLog(){
  const found=FISH.filter(f=>S.fish[f.id]).length;
  let h=`<div class="stats"><div class="stat"><b>${S.casts}</b><span>casts</span></div><div class="stat"><b>${found}/${FISH.length}</b><span>fish found</span></div>${S.up.rod>=TIERS[4].g?`<div class="stat"><b>+${Math.round((pityMult()-1)*100)}%</b><span>legendary luck</span></div>`:""}${S.rb?`<div class="stat"><b>x${rbMult().toFixed(1)}</b><span>rebirth ${S.rb}</span></div>`:""}</div>`;
  h+=`<h2>Recent catches</h2>`;
  if(!S.log.length)h+=`<p class="muted">Nothing yet. Tap Cast.</p>`;
  S.log.slice(0,20).forEach(r=>{
    const f=FISH[r.fi],T=TIERS[f.t],m=r.mut?MUT_BY[r.mut]:null;
    h+=`<div class="logrow">${spriteImg(r.fi,r.mut,false,44,f.n,28)}<div class="tx"><span style="color:${T.c}">${m?m.n+" ":""}${f.n}</span><br><span class="small muted">${T.n}${r.kind==="new"?" · new":r.kind==="better"?" · better":""}${r.tr&&r.tr.length?" · "+r.tr.map(i=>TR_BY[i]?TR_BY[i].n:"").join(", "):""}</span></div>
      <div class="r">${r.kind==="sold"?"+"+fmt(r.gain):"+"+fmt(r.gain)+"/s"}</div></div>`;
  });
  h+=`<p style="margin-top:14px"><button class="link-btn" id="reset">Reset save</button></p>`;
  panel.innerHTML=h;
  $("#reset").onclick=function(){
    if(this.dataset.armed){S=fresh();save();lastWall=Date.now();hideCard();refreshAll();}
    else{this.dataset.armed=1;this.classList.add("warn");this.textContent="Tap again to erase everything";}
  };
}
function renderPanel(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===S.tab)));
  const top=panel.scrollTop;
  (S.tab==="up"?renderUp:S.tab==="album"?renderAlbum:S.tab==="traits"?renderTraits:renderLog)();
  panel.scrollTop=top;
}
function refreshHead(){$("#coins").textContent=fmt(S.coins);$("#rate").textContent=fmt(income());}
function refreshAll(){refreshHead();renderPanel();}

function openFish(i){
  const f=FISH[i],T=TIERS[f.t],e=S.fish[f.id],pct=fishChance(f)*100;
  const vars=[{id:null,n:"Normal",c:"#fff",got:e&&e.norm}].concat(ALL_MUTS.map(m=>({id:m.id,n:m.n,c:m.c,got:e&&e.muts[m.id]})));
  const tideTxt=f.w==="Sea"?"High tide":f.w==="Lake"?"Low tide":"Any tide";
  showModal(`<h3 style="color:${e?T.c:"var(--muted)"}">${e?f.n:"Unknown fish"}</h3><div class="small muted">${T.n} · ${f.w}</div>
   <div class="big">${spriteImg(i,e?bestMutId(e):null,!e,170,f.n,88)}</div>
   <dl class="kv"><dt>Pays</dt><dd>${fmt(f.inc)}/sec base</dd><dt>Your best</dt><dd>${e?"x"+e.best+" · "+fmt(f.inc*e.best*lampMult()*rbMult())+"/sec":"not caught"}</dd>
   <dt>Caught</dt><dd>${e?e.count:0} times</dd><dt>Bites most at</dt><dd>${tideTxt}</dd><dt>Bite chance now</dt><dd>${(T.g||0)>S.up.rod?"Needs Lucky Rod Lv "+T.g:(pct<.1?pct.toFixed(3):pct<1?pct.toFixed(2):pct.toFixed(1))+"% per cast"}</dd></dl>
   ${e?(e.tr&&e.tr.length?`<div class="small muted">Best traits (x${+traitMult(e.tr).toFixed(2)})</div>`+chipHTML(e.tr):`<div class="small muted">Best version has no traits</div>`):""}
   <div class="vars">${vars.map(v=>`<div class="var ${v.got?"":"off"}"><div class="vi">${spriteImg(i,v.id,!v.got,50,"",28)}</div><span style="color:${v.got?v.c:"var(--muted)"}">${v.n}</span></div>`).join("")}</div>
   <button class="close" id="mclose">Close</button>`,e?T.c:"#3b4175");
  $("#mclose").onclick=closeModal;
}

/* ---------- events ---------- */
btn.addEventListener("click",startCast);
$("#stage").addEventListener("click",()=>{if(cardShown)hideCard();else startCast();});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;S.tab=b.dataset.tab;renderPanel();save();});
panel.addEventListener("click",e=>{
  const rb=e.target.closest("button[data-rb]");
  if(rb){if(!rbReady())return;if(S.rbArm){S.rbArm=0;doRebirth();}else{S.rbArm=1;renderPanel();setTimeout(()=>{if(S.rbArm){S.rbArm=0;renderPanel();}},4000);}return;}
  const u=e.target.closest("button[data-up]");
  if(u){const d=UPS.find(x=>x.id===u.dataset.up),l=S.up[d.id],c=upCost(d,l);if(l<d.max&&S.coins>=c){S.coins-=c;S.up[d.id]++;sfx.buy();save();refreshAll();}return;}
  const f=e.target.closest("button[data-fi]");if(f)openFish(+f.dataset.fi);
});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
$("#snd").addEventListener("click",function(){S.sound=!S.sound;this.setAttribute("aria-pressed",String(S.sound));save();});
document.addEventListener("visibilitychange",()=>{if(document.hidden)save();else{econTick();refreshAll();}});
addEventListener("pagehide",save);

/* ---------- menu ---------- */
const menu=$("#menu"),mctx=$("#menuScene").getContext("2d");mctx.imageSmoothingEnabled=false;
function hasProgress(){return S.casts>0||Object.keys(S.fish).length>0;}
function refreshMenu(){
  const found=FISH.filter(f=>S.fish[f.id]).length;
  $("#mPlay").textContent=hasProgress()?"Continue":"Play";
  $("#mNew").hidden=!hasProgress();
  $("#mNew").textContent="New game";$("#mNew").classList.remove("warn");delete $("#mNew").dataset.armed;
  $("#mstat").innerHTML=hasProgress()?`Fish found <b>${found}/${FISH.length}</b> · Earning <b>${fmt(income())}/sec</b>`:"Your first fish is waiting.";
  $("#mSound").textContent="Sound: "+(S.sound?"On":"Off");
}
function openMenu(){menuOpen=true;menu.hidden=false;refreshMenu();}
function closeMenu(){
  menuOpen=false;menu.hidden=true;
  if(pendingModal){const m=pendingModal;pendingModal=null;showModal(m.html,m.rc);if($("#mclose"))$("#mclose").onclick=closeModal;}
}
$("#mPlay").onclick=()=>{beep(660,.08,"square",.05);closeMenu();};
$("#menuBtn").onclick=openMenu;
$("#mSound").onclick=()=>{S.sound=!S.sound;$("#snd").setAttribute("aria-pressed",String(S.sound));save();refreshMenu();beep(660,.08,"square",.05);};
$("#mHow").onclick=()=>{
  showModal(`<h3>How to play</h3><ol class="howto">
    <li>Tap <b>Cast</b>. Fish bite at random, so tap the water to lure them faster. When the bobber jumps, tap <b>HOOK!</b> fast: a quick hook makes rare variants and traits more likely, missing makes them less likely.</li>
    <li>Every new fish you catch is added to your album and <b>pays coins every second</b>.</li>
    <li>Rarer fish pay far more. Shiny, Giant, Golden and Glitched versions pay even more, but they are very rare.</li>
    <li><b>Tides</b> rise and fall every 5 minutes. High tide brings sea fish, low tide brings lake fish.</li>
    <li><b>Weather</b> comes and goes. Some fish caught in rain, fog, snow, storms or an aurora can get a weather mutation that you cannot get any other way.</li>
    <li><b>Traits</b> are rare bonuses earned by how and when you fish: the tide, the hour, how long you waited, the weather. A few are limited-time: one rotates in every day and some only appear on certain dates. They multiply together and with mutations. See the Traits tab.</li>
    <li>Spend coins on <b>Gear</b> to find rare fish and variants more often. <b>Legendary fish only start biting at Lucky Rod Lv 5.</b></li>
    <li>Catch a duplicate and it sells for coins. When you leave, your fish keep earning at half rate for up to 4 hours.</li></ol>
    <button class="close" id="mclose">Got it</button>`);
  $("#mclose").onclick=closeModal;
};
function saveCode(){save();return "TW1:"+btoa(unescape(encodeURIComponent(JSON.stringify(S))));}
function readCode(txt){
  txt=(txt||"").trim();if(txt.indexOf("TW1:")!==0)throw 0;
  const o=JSON.parse(decodeURIComponent(escape(atob(txt.slice(4)))));
  if(!o||typeof o.coins!=="number"||typeof o.fish!=="object")throw 0;return o;
}
$("#mCode").onclick=()=>{
  showModal(`<h3>Save code</h3><p class="small muted">Copy this code to back up your game or move it to another device. To restore, paste a code below and tap Import.</p>
    <textarea id="codeOut" readonly rows="3" style="width:100%;font-size:12px;background:var(--panel2);color:var(--ink);border:2px solid var(--line)"></textarea>
    <button class="close" id="codeCopy">Copy code</button>
    <textarea id="codeIn" rows="3" placeholder="Paste a code here" style="width:100%;margin-top:10px;font-size:12px;background:var(--panel2);color:var(--ink);border:2px solid var(--line)"></textarea>
    <div id="codeMsg" class="small muted" style="min-height:18px"></div>
    <button class="close" id="codeGo">Import</button><button class="close" id="mclose" style="margin-top:8px">Close</button>`);
  $("#codeOut").value=saveCode();$("#mclose").onclick=closeModal;
  $("#codeCopy").onclick=()=>{const t=$("#codeOut");t.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}try{navigator.clipboard.writeText(t.value);ok=true;}catch(e){}$("#codeMsg").textContent=ok?"Copied.":"Select the code and copy it by hand.";};
  $("#codeGo").onclick=function(){
    if(!this.dataset.armed){try{readCode($("#codeIn").value);}catch(e){$("#codeMsg").textContent="That code does not look right.";return;}
      this.dataset.armed=1;this.textContent="Tap again to replace your game";$("#codeMsg").textContent="This overwrites your current save.";return;}
    try{const o=readCode($("#codeIn").value);S=Object.assign(fresh(),o);if(!S.tseen)S.tseen={};S.up=Object.assign(fresh().up,o.up||{});migrate();S.last=Date.now();save();lastWall=Date.now();hideCard();refreshAll();refreshMenu();closeModal();}
    catch(e){$("#codeMsg").textContent="Import failed.";}
  };
};
$("#mNew").onclick=function(){
  if(this.dataset.armed){S=fresh();save();lastWall=Date.now();hideCard();refreshAll();$("#hint").hidden=false;refreshMenu();}
  else{this.dataset.armed=1;this.classList.add("warn");this.textContent="Tap again to erase everything";}
};

/* ---------- boot ---------- */
load();
$("#snd").setAttribute("aria-pressed",String(S.sound));
if(S.casts>0)$("#hint").hidden=true;
lastWall=S.last||Date.now();
econTick();           // pays offline earnings
$("#ver").textContent="v"+VERSION;
refreshAll();setBtn();refreshMenu();refreshEnv();
if(wasReset){showModal(`<h3 data-defer>Fresh start in v${VERSION}</h3><p>This update rebalances the whole game: a slower economy, rarer fish and rarer, stronger traits. Every save was reset, so you start over with an empty album. Thanks for playing!</p><button class="close" id="mclose">Let's fish</button>`);}
let lastUI=0,lastSave=0;
function frame(){
  const now=performance.now(),t=now/1000;
  stepPhase(now);drawScene(t,now);if(menuOpen)mctx.drawImage(cv,0,0);
  if(now-lastUI>250){econTick();refreshHead();refreshUpButtons2();refreshEnv();lastUI=now;}
  if(now-lastSave>5000){save();lastSave=now;}
  requestAnimationFrame(frame);
}
function refreshUpButtons2(){if(S.tab==="up")refreshUpButtons();}
requestAnimationFrame(frame);
window.__tw={pityMult,rbMult,rbReady,doRebirth,hook,pop,dayInfo,DAILY,saveCode,readCode,setHookF(v){hookF=v;},TRAITS,TR_BY,rollTraits,traitCtx,traitMult,dayInfo,seasonInfo,SEASONS,ICONS,get S(){return S;},FISH,TIERS,MUTS,WMUTS,ALL_MUTS,tideInfo,weatherInfo,fishChance,rollFish,rollMut,tierWeights,income,upCost,UPS,getSprite,doCatch,startCast,get phase(){return phase;},refreshAll,econTick,setLast(t){lastWall=t;}};
})();
</script>
